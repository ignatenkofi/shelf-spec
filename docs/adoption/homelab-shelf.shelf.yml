# shelf.yml — openshelf manifest (shelf-spec v0)
# Pre-docshelf shelf: no .docshelf.json, nested docs root, no category
# directories (categories live as INDEX headings), index generated by an
# external script, PDF sidecars in DOCS/compressed. All of that is legal
# when declared here (mode: single, implicit categories).
spec_version: "0.1"
mode: single
name: "HomeLab DOCS"
profile: document
docs_root: DOCS/markdown
# categories omitted: implicit — documents live directly in docs_root.
index:
  path: INDEX.md
  generated_by: external
extra_dirs:
  - DOCS/compressed
