[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelf-spec"
dynamic = ["version"]
description = "shelf-spec: portable, vendor-neutral agent memory as a git repo of Markdown — spec, validator, thin MCP server and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Filipp Ignatenko", email = "ignatenkofi@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "agent-memory", "markdown", "git", "spec", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    # mcp 2.0.0 removed mcp.server.fastmcp — pin the SDK by major.
    "mcp>=1.2.0,<2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.scripts]
shelf-spec = "shelf_spec.cli:main"

[project.urls]
Homepage = "https://github.com/ignatenkofi/shelf-spec"
Repository = "https://github.com/ignatenkofi/shelf-spec"

[tool.hatch.version]
path = "src/shelf_spec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf_spec"]

[tool.hatch.build.targets.wheel.force-include]
# The canonical schema lives in spec/ (single source of truth); ship a copy
# inside the wheel so the installed package can validate manifests offline.
"spec/shelf.schema.json" = "shelf_spec/spec/shelf.schema.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "spec/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["shelf_spec"]
