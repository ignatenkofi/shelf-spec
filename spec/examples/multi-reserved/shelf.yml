# Example: multi-agent shelf manifest — RESERVED (M1).
# The v0 schema accepts this manifest so future manifests do not break
# v0 tooling; v0 validators report multi mode as reserved, they do not
# enforce zones or provenance.
spec_version: "0.1"
mode: multi
name: "Example shared shelf (reserved sketch)"
profile: document
docs_root: docs
categories:
  - drawings
  - docs
index:
  path: INDEX.md
  generated_by: docshelf-mcp
agents:
  path: agents.yml
provenance:
  dir: provenance/
  required: true
