name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Trusted publishing on PyPI uses OIDC — no secrets required.
# Configure on PyPI: https://pypi.org/manage/account/publishing/
permissions:
  contents: write   # to create GitHub Releases
  id-token: write   # to mint the OIDC token for PyPI

jobs:
  build:
    name: Build distribution
    # Ферма polygon-iac. Биллинг GitHub владелец не возобновляет
    # (решение 2026-08-09), поэтому релиз на hosted не «дороже» — он
    # НЕ СТАРТУЕТ вовсе, и выпустить релиз сегодня невозможно.
    #
    # Публикация идёт через OIDC trusted publishing: постоянного токена
    # PyPI нигде не лежит, GitHub выдаёт короткоживущий под конкретный
    # workflow конкретного репозитория. Обменивает его на артефакт и
    # грузит в индекс теперь эфемерная VM фермы, живущая минуты. Решение
    # владельца 2026-08-10: собственное железо предпочтительнее
    # возобновления билинга.
    runs-on: [self-hosted, polygon]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify artifacts
        run: |
          ls -lh dist/
          python -m pip install twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    # Ферма polygon-iac. Биллинг GitHub владелец не возобновляет
    # (решение 2026-08-09), поэтому релиз на hosted не «дороже» — он
    # НЕ СТАРТУЕТ вовсе, и выпустить релиз сегодня невозможно.
    #
    # Публикация идёт через OIDC trusted publishing: постоянного токена
    # PyPI нигде не лежит, GitHub выдаёт короткоживущий под конкретный
    # workflow конкретного репозитория. Обменивает его на артефакт и
    # грузит в индекс теперь эфемерная VM фермы, живущая минуты. Решение
    # владельца 2026-08-10: собственное железо предпочтительнее
    # возобновления билинга.
    runs-on: [self-hosted, polygon]
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/shelf-spec/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No `password:` — OIDC trusted publishing is used.
          # Make sure PyPI -> Project -> Publishing has this repo configured.
          print-hash: true

  github-release:
    name: Create GitHub Release
    # Ферма polygon-iac. Биллинг GitHub владелец не возобновляет
    # (решение 2026-08-09), поэтому релиз на hosted не «дороже» — он
    # НЕ СТАРТУЕТ вовсе, и выпустить релиз сегодня невозможно.
    #
    # Публикация идёт через OIDC trusted publishing: постоянного токена
    # PyPI нигде не лежит, GitHub выдаёт короткоживущий под конкретный
    # workflow конкретного репозитория. Обменивает его на артефакт и
    # грузит в индекс теперь эфемерная VM фермы, живущая минуты. Решение
    # владельца 2026-08-10: собственное железо предпочтительнее
    # возобновления билинга.
    runs-on: [self-hosted, polygon]
    # Tag pushes only: a workflow_dispatch run would otherwise create a
    # bogus release named after the branch.
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Release notes from CHANGELOG
        run: |
          python - <<'PY' > release_notes.md
          import os, re, pathlib
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # "## <version> ..." or "## [<version>] ..." up to the next "## " heading
          pattern = re.compile(
              rf"##\s*\[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=\n##\s|\Z)",
              re.DOTALL,
          )
          m = pattern.search(text)
          if m:
              print(m.group(1).strip())
          else:
              print(f"Release {version}. See CHANGELOG.md for details.")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
