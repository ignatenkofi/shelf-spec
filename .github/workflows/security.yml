name: security
# Файл-адаптер публичного DevSecOps-конвейера
# (ignatenkofi/devsecops-pipeline-public). Репо ПУБЛИЧНЫЙ с 2026-09-09:
# hosted-минуты бесплатны, а ферма polygon-iac публичные репо не
# обслуживает (ADR 0003, fail-closed в demand-select) — поэтому light
# исполняется на ubuntu-latest, как у docshelf-mcp. Состав стадий и
# fail-политика — в профиле класса на стороне конвейера.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pipeline:
    uses: ignatenkofi/devsecops-pipeline-public/.github/workflows/pipeline-light.yml@v1
    with:
      repo-class: library
      runs-on: ubuntu-latest
