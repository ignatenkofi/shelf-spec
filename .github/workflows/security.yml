name: security
# Файл-адаптер публичного DevSecOps-конвейера
# (ignatenkofi/devsecops-pipeline-public). Репо ПРИВАТНЫЙ (комментарий
# раньше утверждал обратное): hosted-минут у приватных больше нет
# (решение владельца 2026-08-09), поэтому light исполняется на ферме
# polygon-iac — вход runs-on ниже. Состав стадий и fail-политика — в
# профиле класса на стороне конвейера.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pipeline:
    uses: ignatenkofi/devsecops-pipeline-public/.github/workflows/pipeline-light.yml@v1
    with:
      repo-class: library
      runs-on: polygon
