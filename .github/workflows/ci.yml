name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Минимум прав: ни одна джоба здесь не пишет — checkout, pip install, ruff,
# pytest и self-check схемы только читают дерево. Более широкие права
# нужны release.yml, и там они выданы точечно, у него свой блок.
permissions:
  contents: read

# Один прогон на ref. Повторный push в ветку PR отменяет прежний, ещё
# идущий прогон (`github.ref` у PR — refs/pull/N/merge); на main прогоны
# не отменяются, а становятся в очередь — у каждого влитого коммита
# остаётся свой статус, и merge не теряет проверку из-за следующего.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # Hosted-раннер, а не ферма polygon-iac. Репозиторий ПУБЛИЧНЫЙ с
    # 2026-09-09 (релиз 0.2.0), и это меняет обе посылки переезда на
    # ферму 2026-08-09: hosted-минуты у публичных репо бесплатны, а
    # self-hosted раннер для публичного репо запрещён ADR 0003 polygon-iac
    # (код из форка побежал бы на VM фермы) — demand-select фермы такой
    # репозиторий не берёт (fail-closed), job висел бы в queued вечно.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        # Обе проверки, не одна: `ruff check` молчит о форматировании, а
        # `ruff format --check` — о lint-правилах. Корень, а не `src tests`:
        # .py-файлов вне них нет, но появившийся не должен остаться вне линта.
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: |
          # Предпосылка до прогона. tests/test_stdio_protocol.py начинается с
          # `pytest.importorskip("mcp")`, и для голого чекаута это правильно.
          # Но `mcp>=2.0.0,<3` — жёсткая зависимость (pyproject `dependencies`),
          # значит здесь скип означает сломанную установку, а не «SDK не нужен».
          # Скипнуть тут — потерять единственный тест, который вообще говорит по
          # протоколу, и получить зелёный прогон, не проверивший транспорт.
          python -c "import mcp"
          pytest -v

      - name: Self-check — all spec examples validate against the schema
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          import jsonschema
          import yaml

          schema = json.loads(pathlib.Path("spec/shelf.schema.json").read_text("utf-8"))
          jsonschema.Draft202012Validator.check_schema(schema)
          validator = jsonschema.Draft202012Validator(schema)
          examples = sorted(pathlib.Path("spec/examples").glob("*/shelf.yml"))
          assert examples, "no spec examples found"
          failed = False
          for path in examples:
              data = yaml.safe_load(path.read_text("utf-8"))
              errors = sorted(validator.iter_errors(data), key=str)
              if errors:
                  failed = True
                  print(f"FAIL {path}")
                  for err in errors:
                      print(f"  - {err.message}")
              else:
                  print(f"ok   {path}")
          sys.exit(1 if failed else 0)
          PY
