name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # Ферма polygon-iac: минуты Actions приватных репо исчерпаны и не
    # возобновляются (переезд портфеля 2026-08-09). На ubuntu-latest эта
    # джоба не «медленнее» — она НЕ СТАРТУЕТ, и отказ выглядит обычной
    # краснотой. Матрица была пропущена в общей пачке переезда: тогда
    # перевели только адаптер security.yml.
    runs-on: [self-hosted, polygon]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run tests
        run: |
          # Предпосылка до прогона. tests/test_stdio_protocol.py начинается с
          # `pytest.importorskip("mcp")`, и для голого чекаута это правильно.
          # Но `mcp>=2.0.0,<3` — жёсткая зависимость (pyproject `dependencies`),
          # значит здесь скип означает сломанную установку, а не «SDK не нужен».
          # Скипнуть тут — потерять единственный тест, который вообще говорит по
          # протоколу, и получить зелёный прогон, не проверивший транспорт.
          python -c "import mcp"
          pytest -v

      - name: Self-check — all spec examples validate against the schema
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          import jsonschema
          import yaml

          schema = json.loads(pathlib.Path("spec/shelf.schema.json").read_text("utf-8"))
          jsonschema.Draft202012Validator.check_schema(schema)
          validator = jsonschema.Draft202012Validator(schema)
          examples = sorted(pathlib.Path("spec/examples").glob("*/shelf.yml"))
          assert examples, "no spec examples found"
          failed = False
          for path in examples:
              data = yaml.safe_load(path.read_text("utf-8"))
              errors = sorted(validator.iter_errors(data), key=str)
              if errors:
                  failed = True
                  print(f"FAIL {path}")
                  for err in errors:
                      print(f"  - {err.message}")
              else:
                  print(f"ok   {path}")
          sys.exit(1 if failed else 0)
          PY
